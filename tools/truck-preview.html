<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#101d23}canvas{display:block}#label{position:absolute;top:32px;left:40px;font:700 24px sans-serif;color:#fff4d6;letter-spacing:3px}</style></head><body><div id="label">NIGHT SHIFT / 02<br><small style="font-size:12px">SEOUL SNACK ATTACK · COLLECTIBLE TRUCK GRAPHICS</small></div><script type="module">
import * as THREE from 'three';

import {createUpgradeToken} from '/src/game/truck-upgrade.js';
