<!doctype html><meta charset="utf-8"><title>Seoul street kit preview</title>
<style>body{margin:0;background:#252a27;color:#f6eed9;font:18px system-ui}h1{position:absolute;top:10px;left:32px;font-size:22px}p{position:absolute;bottom:8px;left:32px}canvas{display:block}</style>
<h1>SEOUL · ORIGINAL STREET KIT</h1><p>Bin · Planter · Bollard · Drain grate · Tactile warning pad</p>
<script type="module">
import * as THREE from 'three';
import {streetItemGeometry} from '/src/world/expanse-street-detail.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);
renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#252a27');
scene.add(new THREE.HemisphereLight(0xfff3da,0x26302b,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(-2,6,4);scene.add(light);
const mat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.8});
['bin','planter','bollard','drain','tactile'].forEach((kind,i)=>scene.add(new THREE.Mesh(streetItemGeometry({kind,x:(i-2)*1.15,y:0,z:0,heading:.15}),mat)));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x343a35,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.01;scene.add(ground);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,30);camera.position.set(0,3.9,7.8);camera.lookAt(0,.18,0);
await renderer.compileAsync(scene,camera);renderer.render(scene,camera);window.previewReady=true;
</script>
