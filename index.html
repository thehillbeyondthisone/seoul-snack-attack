<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>서울 스낵 어택 — Seoul Snack Attack</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #05060a; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        color: #e8e6df; font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
        background: radial-gradient(ellipse at center, #10141f 0%, #05060a 100%);
        z-index: 100; transition: opacity 0.6s;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading.error { background: radial-gradient(ellipse at center, #24101a 0%, #05060a 72%); }
      #loading h1 { font-size: 42px; margin: 0; letter-spacing: 2px; }
      #loading .sub { font-size: 14px; opacity: 0.6; letter-spacing: 4px; }
      #loading .status { min-height: 18px; color: #aab6ca; font-size: 12px; letter-spacing: .06em; }
      #loading .progress { display: flex; align-items: center; gap: 12px; }
      #loading .bar { width: min(320px, 68vw); height: 4px; background: #1c2230; border-radius: 2px; overflow: hidden; }
      #loading .bar > div { height: 100%; width: 0%; background: #ff2d78; transition: width 0.2s; }
      #loading .percent { width: 38px; color: #e8e6df; font-size: 11px; font-variant-numeric: tabular-nums; }
      #loading .error-detail { display: none; max-width: min(560px, calc(100vw - 48px)); color: #ffb5ca; font: 12px/1.5 Consolas, monospace; text-align: center; overflow-wrap: anywhere; }
      #loading.error .error-detail, #loading.error .retry { display: block; }
      #loading .retry { display: none; padding: 9px 16px; border: 1px solid #ff2d78; color: #fff; background: rgba(255,45,120,.12); cursor: pointer; font: 600 11px 'Segoe UI', sans-serif; letter-spacing: .1em; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading" role="status" aria-live="polite" aria-busy="true">
      <h1>서울 스낵 어택</h1>
      <div class="sub">SEOUL SNACK ATTACK</div>
      <div class="status" id="loadstatus">도시를 준비하는 중 · Preparing the city</div>
      <div class="progress">
        <div class="bar"><div id="loadbar"></div></div>
        <div class="percent" id="loadpercent">0%</div>
      </div>
      <div class="error-detail" id="loaderror"></div>
      <button class="retry" id="loadretry" type="button">RETRY</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
